<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>こぎつね 登録シート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one column checklist that mirrors the LINE Creators Market form top to bottom */
:root{
  --bg:#faf7f4; --card:#ffffff; --fg:#2a2220; --muted:#7b6e69; --line:#eadfd8;
  --accent:#c8312b; --accent-ink:#ffffff; --done:#2f7d55; --done-bg:#e8f4ed; --chip:#f6eeea;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1716; --card:#262020; --fg:#f2ebe8; --muted:#a89993; --line:#3a302e;
  --accent:#ef5a4f; --accent-ink:#1c1716; --done:#6fcf98; --done-bg:#1f3328; --chip:#322928; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1716; --card:#262020; --fg:#f2ebe8; --muted:#a89993; --line:#3a302e;
  --accent:#ef5a4f; --accent-ink:#1c1716; --done:#6fcf98; --done-bg:#1f3328; --chip:#322928; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:28px}
header{display:grid;gap:6px}
h1{font-family:var(--display);font-size:1.75rem;margin:0;text-wrap:balance}
h1 small{color:var(--accent);font-size:1rem;margin-right:.4em}
.lead{color:var(--muted);margin:0;font-size:.9rem}
.progress{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .2s}
section{display:grid;gap:10px}
h2{font-family:var(--display);font-size:1.1rem;margin:0;display:flex;gap:8px;align-items:baseline}
h2 span{font-size:.75rem;color:var(--muted);font-family:var(--body);font-weight:400}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.row.done{background:var(--done-bg);border-color:transparent}
.lbl{font-size:.75rem;color:var(--muted);letter-spacing:.04em;grid-column:1}
.val{grid-column:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.val.long{font-weight:400;font-size:.92rem}
.meta{grid-column:1;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
button.copy{grid-column:2;grid-row:1 / span 3;font:inherit;font-size:.85rem;font-weight:700;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-width:84px}
.row.done button.copy{background:var(--done);color:var(--accent-ink)}
button.copy:focus-visible,.pick:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.pick{grid-column:2;grid-row:1 / span 3;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--done)}
.note{font-size:.8rem;color:var(--muted);margin:0}
.tags{display:grid;gap:8px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.tag img{width:64px;height:56px;object-fit:contain;background:var(--chip);border-radius:6px}
.tag .no{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip.done{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.chip:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.reset{justify-self:start;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .15s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header>
  <h1><small>⛩</small>こぎつね 登録シート</h1>
  <p class="lead">LINE Creators Market のフォームの上から順です。赤いボタンを押すとコピーされるので、そのままフォームに貼り付けてください。選ぶだけの項目は、選んだらチェックを付けてください。</p>
  <div class="progress"><span id="pc">0 / 0</span><div class="bar"><i id="pb"></i></div></div>
</header>
<div id="app"></div>
<button class="reset" id="reset" type="button">チェックをすべて外す</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

async function copy(text,el){
  try{await navigator.clipboard.writeText(text);}catch(e){
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")}catch(_){ } ta.remove();}
  toast("コピーしました："+(text.length>18?text.slice(0,18)+"…":text));
}
const app=document.getElementById("app");app.style.display="grid";app.style.gap="28px";
for(const s of F){
  const sec=document.createElement("section");
  sec.innerHTML=`<h2>${s.h}${s.sub?`<span>${s.sub}</span>`:""}</h2>`;
  for(const it of s.items){
    const r=document.createElement("div");r.className="row"+(st[it.k]?" done":"");
    const meta=it.max?`${len(it.v)} / ${it.max} 文字`:(it.n||"");
    r.innerHTML=`<div class="lbl">${it.l}</div><div class="val${it.long?" long":""}"></div>${meta?`<div class="meta">${meta}</div>`:""}`;
    r.querySelector(".val").textContent=it.v;
    if(it.pick){
      const lab=document.createElement("label");lab.className="pick";
      lab.innerHTML=`<input type="checkbox" id="c_${it.k}" ${st[it.k]?"checked":""}>選んだ`;
      lab.querySelector("input").onchange=e=>{st[it.k]=e.target.checked;r.classList.toggle("done",e.target.checked);save()};
      r.appendChild(lab);
    }else{
      const b=document.createElement("button");b.className="copy";b.type="button";b.id="b_"+it.k;
      b.textContent=st[it.k]?"コピー済":"コピー";
      b.onclick=()=>{copy(it.v);st[it.k]=true;r.classList.add("done");b.textContent="コピー済";save()};
      r.appendChild(b);
    }
    sec.appendChild(r);
  }
  app.appendChild(sec);
  if(s.h==="ライセンス証明"){
    const ts=document.createElement("section");
    ts.innerHTML=`<h2>タグ設定<span>各スタンプ9つ・LINEのタグ一覧から選択</span></h2><p class="note">タグを押すとコピーされます。タグ欄の検索に貼り付けて選んでください。一覧にない語は近い語を選んでください。</p>`;
    const g=document.createElement("div");g.className="tags";
    for(const [no,name,tags] of TAGS){
      const d=document.createElement("div");d.className="tag";
      d.innerHTML=`<img alt="${no} ${name}" src="${T[no]}"><div><div class="no">${no}　${name}</div><div class="chips"></div></div>`;
      const c=d.querySelector(".chips");
      tags.forEach((t,i)=>{const k=`t${no}_${i}`;const b=document.createElement("button");b.type="button";b.id=k;b.className="chip"+(st[k]?" done":"");b.textContent=t;
        b.onclick=()=>{copy(t);st[k]=true;b.classList.add("done");save()};c.appendChild(b)});
      g.appendChild(d);
    }
    ts.appendChild(g);app.appendChild(ts);
  }
}
function prog(){
  const keys=[...F.flatMap(s=>s.items.map(i=>i.k)),...TAGS.flatMap(([no,,t])=>t.map((_,i)=>`t${no}_${i}`))];
  const n=keys.filter(k=>st[k]).length;
  document.getElementById("pc").textContent=`${n} / ${keys.length} 完了`;
  document.getElementById("pb").style.width=(100*n/keys.length)+"%";
}
document.getElementById("reset").onclick=()=>{st={};save();location.reload()};
prog();
