<title>アイビAI事務所</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-column app shell. Entrance = an illustrated office (wall with a window onto the Alps, wood floor, desks) where each agent sits; tap a desk to enter that agent's menu, then a chat-like work screen. */
:root {
  --bg: #fbf6f1;
  --surface: #ffffff;
  --ink: #45383a;
  --ink-soft: #85767a;
  --line: #eadfd8;
  --wall: #f7ede3;
  --wall-trim: #e7d5c3;
  --floor: #d9b48c;
  --floor-line: #c89f74;
  --desk: #b98a5e;
  --desk-top: #cfa275;
  --sky-1: #bfe0f2;
  --sky-2: #eaf5fb;
  --mtn: #8aa3b8;
  --snow: #ffffff;
  --accent: #c95c7b;
  --accent-wash: #fde7ec;
  --helmet: #e9a93a;
  --helmet-wash: #fdf1da;
  --shadow: 0 6px 24px rgba(120, 80, 50, .12);
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #211b1c; --surface: #2c2425; --ink: #f4e9e6; --ink-soft: #c0aeaa; --line: #46393a;
    --wall: #3a302d; --wall-trim: #4a3d38; --floor: #6b4f3a; --floor-line: #5a4231; --desk: #7a5a3e; --desk-top: #8f6a49;
    --sky-1: #24335a; --sky-2: #46507a; --mtn: #5b6a86; --snow: #d9e0ee;
    --accent: #f2a3b9; --accent-wash: #47303a; --helmet: #f0b955; --helmet-wash: #463a26;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #211b1c; --surface: #2c2425; --ink: #f4e9e6; --ink-soft: #c0aeaa; --line: #46393a;
  --wall: #3a302d; --wall-trim: #4a3d38; --floor: #6b4f3a; --floor-line: #5a4231; --desk: #7a5a3e; --desk-top: #8f6a49;
  --sky-1: #24335a; --sky-2: #46507a; --mtn: #5b6a86; --snow: #d9e0ee;
  --accent: #f2a3b9; --accent-wash: #47303a; --helmet: #f0b955; --helmet-wash: #463a26;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 520px; margin: 0 auto; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* office header */
.sign { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sign h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .04em; }
.sign small { color: var(--ink-soft); font-size: 12px; letter-spacing: .08em; }

/* office scene */
.office { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3.3; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); border: 2px solid var(--line); }
.office svg.bgsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.seats { position: absolute; left: 3%; right: 3%; bottom: 4%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; align-items: end; }
.seat { position: relative; display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 0; min-width: 0; }
.seat .who { width: 100%; max-width: 100%; height: auto; margin-bottom: -20%; position: relative; z-index: 1; transition: transform .18s; }
.seat:hover .who, .seat:focus-visible .who { transform: translateY(-6px); }
.seat .desk { position: relative; z-index: 2; width: 100%; aspect-ratio: 3.2 / 1; background: var(--desk); border-radius: 10px 10px 6px 6px; box-shadow: inset 0 7px 0 var(--desk-top); display: grid; place-items: end center; padding-bottom: 7%; }
.plate { background: var(--surface); color: var(--ink); border-radius: 6px; padding: 0 8px; font-family: var(--font-display); font-weight: 700; font-size: clamp(10px, 2.8vw, 13px); line-height: 1.6; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.prop { position: absolute; z-index: 3; top: -24%; }
.seat .tip { position: absolute; top: -6%; left: 50%; transform: translate(-50%, -100%); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 2px 10px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .18s; z-index: 4; pointer-events: none; }
.seat:hover .tip, .seat:focus-visible .tip { opacity: 1; }
.seat.empty { cursor: default; }
.seat.empty .chair { width: 52%; height: auto; margin-bottom: -6%; opacity: .75; }
.seat.empty .plate { background: transparent; border: 1.5px dashed var(--surface); color: var(--surface); }

/* member list */
.section { font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); font-weight: 700; }
.members { display: flex; flex-direction: column; gap: 10px; }
.member { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 10px 14px; transition: border-color .15s; }
.member:hover { border-color: var(--c); }
.member img { width: 48px; height: 48px; object-fit: contain; border-radius: 50%; background: var(--cw); padding: 3px; flex: none; }
.member div { min-width: 0; flex: 1; }
.member b { font-family: var(--font-display); font-size: 16px; display: block; line-height: 1.4; }
.member span { font-size: 12px; color: var(--ink-soft); }
.member .go { font-size: 20px; color: var(--c); }
.member.soon { border-style: dashed; cursor: default; }
.member.soon .av { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--ink-soft); font-weight: 700; flex: none; }

/* inner screens */
.bar { display: flex; align-items: center; gap: 10px; }
.bar img { width: 46px; height: 46px; object-fit: contain; border-radius: 50%; background: var(--cw); padding: 3px; }
.bar .t { font-family: var(--font-display); font-weight: 700; font-size: 17px; flex: 1; min-width: 0; line-height: 1.3; }
.bar .t small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.back { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 13px; white-space: nowrap; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 22px; padding: 14px; min-width: 0; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--c); transform: translateY(-2px); }
.tile .ic { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: var(--cw); color: var(--c); }
.tile .ic svg { width: 22px; height: 22px; }
.tile b { font-family: var(--font-display); font-size: 15px; line-height: 1.35; }
.tile span { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.talk { display: flex; gap: 10px; align-items: flex-start; }
.talk img { width: 42px; height: 42px; flex: none; object-fit: contain; border-radius: 50%; background: var(--cw); padding: 3px; }
.say { background: var(--surface); border: 2px solid var(--line); border-radius: 4px 20px 20px 20px; padding: 12px 16px; min-width: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.say strong { color: var(--c); }
.say.wait { color: var(--ink-soft); }
label.lab { font-size: 13px; font-weight: 700; }
textarea, input[type=text] { width: 100%; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font: inherit; background: var(--surface); color: var(--ink); }
textarea { min-height: 110px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; background: var(--cw); border-radius: 18px; padding: 12px 14px; }
.field p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.start { flex: 1; min-width: 140px; border: 0; border-radius: 999px; padding: 13px; background: var(--c); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .06em; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.start:disabled { opacity: .6; cursor: progress; }
:root[data-theme="dark"] .start { color: #241a1c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start { color: #241a1c; } }
.ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-size: 14px; }
.note { font-size: 12px; color: var(--ink-soft); background: var(--cw); border-radius: 12px; padding: 8px 12px; margin: 0; }
.foot { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 0; }
@media (prefers-reduced-motion: reduce) { .seat .who, .tile, .seat .tip { transition: none; } }
</style>

- お客様の名前・住所などは必要な範囲でしか書かない。日本語で、結論から短く。専門用語は使わない。
情報の元：①依頼文 ②全案件を1つにまとめた工程管理シート（下に指定があればそれを使う。なければ search_drive で探し、見つからない・候補が複数なら勝手に決めず「どのシートか確認が必要」と候補を挙げて報告） ③Googleカレンダー（calendar_events で日程のぶつかりを確認）。シートは sheet_tabs でタブ名を確かめてから read_sheet で読む。
休日（工程を入れない）：日曜、祝日、第2・第4土曜、お盆8/13〜8/16、正月12/29〜1/4。日数は休日を除いた営業日で数え、休日にかかる工程は次の営業日に送る。
工程の標準パターン：新築・水回りリフォーム・外壁・屋根・内装リフォームの4種類は聞き取り中。標準パターンを作らず、工程と日数は依頼文で確認する（書いていなければ不足している情報として聞く）。
遅れの基準：終了予定日を過ぎても終わっていない工程が、休日を除いて3日以上遅れていたら「遅れ」。2日以内は「遅れ」と書かない。
返す形：1.結論（ひとことで） 2.遅れ・注意点（あれば） 3.スプレッドシートの変更案（シート名・行・列ごとに「今の値 → 新しい値」） 4.カレンダーの登録・変更案（希望がある場合） 5.不足している情報`,
    tasks: [
      { id: "plan", icon: "gantt", title: "工程表の案を作る", sub: "新しい現場の日程を組む", ask: "新しい現場ですね。邸名と工事の中身、着工日と完成希望日を教えてください。工程と日数もわかれば一緒にどうぞ。", label: "邸名・工事内容・着工日・完成希望日・工程と日数", required: true, ph: "例：田村邸 水回りリフォーム\n着工 12/1、完成希望 12/20\n解体2日→配管1日→設備取付2日→内装2日",
        job: "手順A：依頼文から邸名・工事内容・着工日・完成希望日を読み取る。工程管理シートを読み、列の並びと書き方を確認して新しい行をそれに合わせる。カレンダーとシート上のほかの案件を見て日程のぶつかりを確認する。工程ごとの開始日・終了日の案を、休日を除いて作る。完成希望日に間に合わないならはっきり言う。" },
      { id: "progress", icon: "done", title: "進捗を伝える", sub: "「◯◯工事が終わった」など", ask: "どの現場の、どの工事の話ですか。終わった・遅れている、どちらでもどうぞ。", label: "進捗の報告", required: true, ph: "例：田村邸の解体が今日終わった",
        job: "手順B：シートで該当する案件と工程を探し、予定と実際の差（早い・遅い・予定どおり）を確認し、シートのどこをどう直せばよいか変更案を作る。後ろの工程に影響があれば先に言う。" },
      { id: "delay", icon: "alert", title: "遅れている現場は？", sub: "全現場をまとめて確認", ask: "全現場の工程を、今日の日付で確認します。", label: "とくに見てほしい現場があれば（なくても大丈夫）", required: false, ph: "例：年内完成の現場を重点的に",
        job: "手順C：シートの全案件を見て、今日の日付で終わっているはずなのに終わっていない工程を探す。遅れの基準（休日を除いて3日以上）に当てはまるものを、遅れの大きい順に先に挙げる。当てはまるものには後ろの工程を組み直した案も出す。" },
      { id: "reschedule", icon: "redo", title: "日程を組み直す", sub: "雨・材料待ちなどで", ask: "組み直しですね。どの現場を、どんな理由で動かすか教えてください。", label: "邸名と理由・動かしたい工程", required: true, ph: "例：田村邸、雨で外壁が2日止まった。完成日は動かしたくない",
        job: "手順C：該当する案件の残りの工程を、休日を避け、カレンダーやほかの現場とぶつからないように組み直した案を作る。完成日が守れるか、守れないなら何日ずれるかを結論で言う。" }
    ]
  }
];
const SOON = [{ label: "準備中" }];

/* ===== Google の道具（読むだけ） ===== */
const TOOLS_MANIFEST = { "Google Sheets": ["get_values", "get_spreadsheet"], "Google Drive": ["search_files"], "Google Calendar": ["list_events"] };
async function use(n) { try { return window.claude && window.claude.use ? await window.claude.use(n) : null; } catch { return null; } }
function clip(v) { const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > 30000 ? s.slice(0, 30000) + "…（長いので途中まで）" : s; }
async function call(server, tool, input, signal) {
  const mcp = await use("mcp");
  if (!mcp) throw new Error("この画面ではGoogleに接続できません");
  try {
    const r = await mcp.callTool(server, tool, input, { signal });
    return clip(r && r.payload !== undefined ? r.payload : r);
  } catch (e) {
    const code = e && e.code;
    const why = code === "not_granted" || code === "approval_required" ? `${server}の使用が許可されていません`
      : code === "server_not_connected" ? `${server}がつながっていません`
      : `${server}を読めませんでした（${code || "error"}）`;
    throw new Error(why);
  }
}
const SAMPLE_TOOLS = [
  { name: "read_sheet", description: "Googleスプレッドシートの範囲の値を読む。spreadsheetId と range（例: 'シート名!A1:Z200'）を渡す。行ごとの値の配列を返す。",
    inputSchema: { type: "object", properties: { spreadsheetId: { type: "string" }, range: { type: "string" } }, required: ["spreadsheetId", "range"] },
    execute: (i, ctx) => call("Google Sheets", "get_values", { spreadsheetId: String(i.spreadsheetId), range: String(i.range) }, ctx.signal) },
  { name: "sheet_tabs", description: "Googleスプレッドシートのタブ（シート）名の一覧を返す。spreadsheetId を渡す。",
    inputSchema: { type: "object", properties: { spreadsheetId: { type: "string" } }, required: ["spreadsheetId"] },
    execute: (i, ctx) => call("Google Sheets", "get_spreadsheet", { spreadsheetId: String(i.spreadsheetId), fields: ["properties.title", "sheets.properties.title"] }, ctx.signal) },
  { name: "search_drive", description: "Googleドライブでファイルを探す。query は Drive の検索式（例: \"title contains '工程' and mimeType = 'application/vnd.google-apps.spreadsheet'\"）。ファイル名・ID・更新日時を返す。",
    inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
    execute: (i, ctx) => call("Google Drive", "search_files", { query: String(i.query), pageSize: 10, excludeContentSnippets: true }, ctx.signal) },
  { name: "calendar_events", description: "Googleカレンダー（メイン）の予定を読む。startTime と endTime はオフセットなしの日本時間（例: '2026-12-01T00:00:00'）。fullText で絞り込みもできる。",
    inputSchema: { type: "object", properties: { startTime: { type: "string" }, endTime: { type: "string" }, fullText: { type: "string" } }, required: ["startTime", "endTime"] },
    execute: (i, ctx) => { const q = { startTime: String(i.startTime), endTime: String(i.endTime), pageSize: 100, orderBy: "startTime" }; if (i.fullText) q.fullText = String(i.fullText); return call("Google Calendar", "list_events", q, ctx.signal); } }
];

/* ===== 画面 ===== */
const app = document.getElementById("app");
let busy = null;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function theme(a) { app.style.setProperty("--c", a.c); app.style.setProperty("--cw", a.cw); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ""; localStorage.setItem(k, v); } catch { return ""; } }

const PROPS = {
  laptop: `<svg class="prop" style="width:34%;left:58%" viewBox="0 0 60 40"><rect x="8" y="2" width="44" height="30" rx="3" fill="#6d7b8a"/><rect x="12" y="6" width="36" height="22" rx="1" fill="#cfe3f0"/><rect x="2" y="32" width="56" height="6" rx="3" fill="#8d9aa8"/></svg>`,
  board: `<svg class="prop" style="width:34%;left:6%" viewBox="0 0 60 40"><rect x="2" y="2" width="56" height="34" rx="3" fill="#fff" stroke="#8a6a4a" stroke-width="3"/><rect x="8" y="9" width="22" height="5" rx="2" fill="#e9a93a"/><rect x="18" y="17" width="26" height="5" rx="2" fill="#7fb069"/><rect x="30" y="25" width="22" height="5" rx="2" fill="#c95c7b"/></svg>`
};

function office() {
  location.hash !== "" && history.replaceState(null, "", location.pathname + location.search);
  app.style.removeProperty("--c"); app.style.removeProperty("--cw");
  const seats = AGENTS.map(a => `
    <button class="seat" data-id="${a.id}" aria-label="${esc(a.name)}（${esc(a.role)}）の席">
      <span class="tip">${esc(a.role)}</span>
      <img class="who" src="${a.img}" alt="">
      <span class="desk">${PROPS[a.prop] || ""}<span class="plate">${esc(a.name)}</span></span>
    </button>`).join("") + SOON.slice(0, Math.max(0, 3 - AGENTS.length)).map(s => `
    <div class="seat empty"><img class="chair" src="${CHAIR}" alt=""><span class="desk"><span class="plate">${s.label}</span></span></div>`).join("");
  app.innerHTML = `
    <header class="sign"><h1>アイビAI事務所</h1><small>席をタップして話しかけてください</small></header>
    <div class="office" role="group" aria-label="事務所">
      <svg class="bgsvg" viewBox="0 0 400 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-1)"/><stop offset="1" style="stop-color:var(--sky-2)"/></linearGradient></defs>
        <rect width="400" height="210" style="fill:var(--wall)"/>
        <rect y="200" width="400" height="10" style="fill:var(--wall-trim)"/>
        <rect x="34" y="26" width="168" height="108" rx="10" style="fill:var(--wall-trim)"/>
        <rect x="42" y="34" width="152" height="92" rx="6" fill="url(#sky)"/>
        <path d="M42 126 L70 84 L86 98 L112 58 L134 88 L150 72 L176 104 L194 92 V126 Z" style="fill:var(--mtn)"/>
        <path d="M104 70 L112 58 L120 69 L114 66 L110 71 Z M144 78 L150 72 L156 79 L151 77 Z M64 93 L70 84 L76 92 L71 90 Z" style="fill:var(--snow)"/>
        <rect x="116" y="34" width="5" height="92" style="fill:var(--wall-trim)"/>
        <circle cx="300" cy="62" r="24" style="fill:var(--surface);stroke:var(--wall-trim)" stroke-width="5"/>
        <path d="M300 62 V48 M300 62 L310 68" style="stroke:var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <rect x="248" y="112" width="104" height="8" rx="3" style="fill:var(--desk)"/>
        <rect x="256" y="92" width="12" height="20" rx="2" fill="#7fa4c4"/><rect x="270" y="88" width="10" height="24" rx="2" fill="#e9a93a"/><rect x="282" y="94" width="14" height="18" rx="2" fill="#c95c7b"/>
        <path d="M330 112 c-4 -14 -14 -18 -10 -30 c6 6 8 12 10 18 c2 -8 6 -16 12 -20 c2 12 -6 20 -12 32 Z" fill="#7fb069"/>
        <rect x="0" y="210" width="400" height="120" style="fill:var(--floor)"/>
        <path d="M0 240 H400 M0 272 H400 M0 304 H400 M60 210 V240 M190 210 V240 M320 210 V240 M120 240 V272 M260 240 V272 M40 272 V304 M200 272 V304 M350 272 V304" style="stroke:var(--floor-line)" stroke-width="2"/>
      </svg>
      <div class="seats">${seats}</div>
    </div>
    <div class="section">メンバー</div>
    <div class="members">
      ${AGENTS.map(a => `<button class="member" data-id="${a.id}" style="--c:${a.c};--cw:${a.cw}"><img src="${a.img}" alt=""><div><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div><span class="go" aria-hidden="true">›</span></button>`).join("")}
      <div class="member soon"><span class="av">＋</span><div><b>新しいメンバー</b><span>これから仲間が増えます</span></div></div>
    </div>`;
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}

function agentMenu(a) {
  theme(a);
  const sheet = a.sheetSetting ? store("sheet-" + a.id) : "";
  app.innerHTML = `
    <div class="bar"><img src="${a.img}" alt=""><div class="t">${esc(a.name)}<small>${esc(a.role)}</small></div><button class="back" id="home">事務所へ</button></div>
    <div class="talk"><img src="${a.img}" alt=""><div class="say">${esc(a.greet)}</div></div>
    ${a.sheetSetting ? `<div class="field"><label class="lab" for="sheet-${a.id}">工程管理シートのURL</label><input type="text" id="sheet-${a.id}" value="${esc(sheet)}" placeholder="https://docs.google.com/spreadsheets/d/…"><p>空のままなら、Googleドライブから探します。入れたURLはこの端末に覚えておきます。</p></div>` : ""}
    <div class="menu">${a.tasks.map(t => `<button class="tile" data-t="${t.id}"><i class="ic">${ICONS[t.icon]}</i><b>${esc(t.title)}</b><span>${esc(t.sub)}</span></button>`).join("")}</div>
    <p class="foot">${esc(a.foot)}</p>`;
  document.getElementById("home").onclick = () => { location.hash = ""; };
  const inp = document.getElementById("sheet-" + a.id);
  if (inp) inp.onchange = () => store("sheet-" + a.id, inp.value.trim());
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => task(a, a.tasks.find(t => t.id === b.dataset.t)));
}

function task(a, t) {
  app.innerHTML = `
    <div class="bar"><img src="${a.img}" alt=""><div class="t">${esc(t.title)}<small>${esc(a.name)}</small></div><button class="back" id="menu">メニュー</button></div>
    <div class="talk"><img src="${a.img}" alt=""><div class="say">${esc(t.ask)}</div></div>
    <label class="lab" for="in-${a.id}-${t.id}">${esc(t.label)}</label>
    <textarea id="in-${a.id}-${t.id}" placeholder="${esc(t.ph)}"></textarea>
    <div class="row"><button class="start" id="run">${esc(a.name)}にお願い</button></div>
    <div id="out"></div>`;
  document.getElementById("menu").onclick = () => { if (busy) busy.abort(); agentMenu(a); };
  document.getElementById("run").onclick = () => run(a, t);
}

async function run(a, t) {
  const input = document.getElementById(`in-${a.id}-${t.id}`).value.trim();
  const out = document.getElementById("out");
  const say = (html) => `<div class="talk"><img src="${a.img}" alt=""><div class="say" id="ans">${html}</div></div>`;
  if (t.required && !input) { out.innerHTML = say(`「${esc(t.label)}」を書いてもらえると、取りかかれます。`); return; }
  const sample = await use("sample");
  if (!sample) { out.innerHTML = `<p class="note">この画面ではお話しできません。claude.ai でこのページを開いてください。</p>`; return; }
  const btn = document.getElementById("run"); btn.disabled = true;
  out.innerHTML = say("資料を確認しています…"); const ans = document.getElementById("ans"); ans.classList.add("wait");

  let extra = "";
  if (a.sheetSetting) {
    const url = store("sheet-" + a.id); const m = url.match(/\/d\/([A-Za-z0-9_-]+)/);
    extra = m ? `工程管理シート：spreadsheetId = ${m[1]}（ユーザーが指定）` : "工程管理シート：未指定。search_drive で探すこと。";
  }
  const now = new Date();
  const today = now.toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "long", day: "numeric", weekday: "short" });
  const prompt = `${a.rules}
${extra}
今日（日本時間）：${today}
使える道具：read_sheet / sheet_tabs / search_drive / calendar_events（どれも読むだけ）。道具がエラーになったら、読めなかったことを最初に伝え、推測で埋めない。
表示の決まり：見出しは【 】、強調は **太字** だけ。表やMarkdownの#は使わない。

やること：${t.job}

依頼文：
${input || "（とくになし）"}`;

  const ctl = new AbortController(); busy = ctl;
  try {
    await sample(prompt, { signal: ctl.signal, modelTier: "default", tools: SAMPLE_TOOLS, cache: false,
      onText: ({ text }) => { ans.classList.remove("wait"); ans.innerHTML = rich(text); } });
    out.insertAdjacentHTML("beforeend", `<div class="row"><button class="ghost" id="copy">答えをコピー</button><button class="ghost" id="again">もう一度</button></div>`);
    document.getElementById("copy").onclick = async (ev) => {
      try { await navigator.clipboard.writeText(ans.textContent); ev.target.textContent = "コピーしました"; }
      catch { const r = document.createRange(); r.selectNodeContents(ans); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ev.target.textContent = "選択しました"; }
    };
    document.getElementById("again").onclick = () => run(a, t);
  } catch (e) {
    if (e && e.code === "cancelled") return;
    const msg = e && e.code === "not_granted" ? "お話しするには許可が必要です。ページの「権限」から許可してください。"
      : e && e.code === "rate_limited" ? "少し混み合っています。ひと息おいてから、もう一度お願いします。"
      : "うまくお返事できませんでした。もう一度お願いします。";
    ans.classList.remove("wait"); ans.textContent = (e && e.text ? e.text + "\n\n" : "") + msg;
  } finally { btn.disabled = false; busy = null; }
}

function route() {
  if (busy) busy.abort();
  const id = location.hash.slice(1);
  const a = AGENTS.find(x => x.id === id);
  a ? agentMenu(a) : office();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
