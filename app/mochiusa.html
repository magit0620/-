<title>もちうさ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-column phone-app shell; entrance = character on a mochi plate, then tile menu, then a chat-like work screen */
:root {
  --bg: #fdf6f7;
  --surface: #ffffff;
  --mochi: #fff9f4;
  --ink: #4a3b3f;
  --ink-soft: #8a777c;
  --sakura: #e98aa3;
  --sakura-deep: #c95c7b;
  --sakura-wash: #fde7ec;
  --leaf: #7fb069;
  --line: #f1dde2;
  --shadow: 0 6px 24px rgba(201, 92, 123, .12);
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241d20; --surface: #2f262a; --mochi: #3a2f33; --ink: #f6e9ec; --ink-soft: #c2aab1;
    --sakura: #f0a3b8; --sakura-deep: #f5b8c9; --sakura-wash: #43303a; --leaf: #9cc987; --line: #4a3a40;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #241d20; --surface: #2f262a; --mochi: #3a2f33; --ink: #f6e9ec; --ink-soft: #c2aab1;
  --sakura: #f0a3b8; --sakura-deep: #f5b8c9; --sakura-wash: #43303a; --leaf: #9cc987; --line: #4a3a40;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 460px; margin: 0 auto; padding-block: 20px 32px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }

/* entrance */
.gate { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 8px; }
.plate { position: relative; width: min(240px, 66vw); height: min(240px, 66vw); overflow: hidden; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--mochi), var(--sakura-wash)); display: grid; place-items: center; box-shadow: var(--shadow); max-width: 100%; }
.plate img { width: auto; height: 84%; max-width: 84%; object-fit: contain; margin-top: 4%; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.petal { position: absolute; width: 14px; height: 14px; border-radius: 80% 0 80% 0; background: var(--sakura); opacity: .7; }
.petal.a { top: 10%; left: 6%; transform: rotate(20deg); }
.petal.b { bottom: 14%; right: 4%; transform: rotate(-30deg); width: 10px; height: 10px; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: .06em; color: var(--sakura-deep); line-height: 1.2; }
.tag { font-size: 12px; color: var(--ink-soft); letter-spacing: .1em; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px 18px; text-align: left; box-shadow: var(--shadow); width: 100%; }
.bubble::before { content: ""; position: absolute; top: -9px; left: 50%; width: 16px; height: 16px; background: var(--surface); border-left: 2px solid var(--line); border-top: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.start { width: 100%; border: 0; border-radius: 999px; padding: 14px; background: var(--sakura-deep); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .08em; box-shadow: 0 4px 0 rgba(0,0,0,.12); transition: transform .12s; }
:root[data-theme="dark"] .start { color: #2a1d22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start { color: #2a1d22; } }
.start:active { transform: translateY(2px); }

/* header for inner screens */
.bar { display: flex; align-items: center; gap: 10px; }
.bar img { width: 44px; height: 44px; object-fit: contain; border-radius: 50%; background: var(--sakura-wash); padding: 3px; }
.bar .t { font-family: var(--font-display); font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
.back { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 13px; }

/* menu */
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 22px; padding: 14px; min-width: 0; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--sakura); transform: translateY(-2px); }
.tile .ic { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: var(--sakura-wash); color: var(--sakura-deep); }
.tile .ic svg { width: 22px; height: 22px; }
.tile b { font-family: var(--font-display); font-size: 15px; line-height: 1.35; }
.tile span { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.section { font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); font-weight: 700; }
.foot { font-size: 12px; color: var(--ink-soft); text-align: center; }

/* work screen */
.talk { display: flex; gap: 10px; align-items: flex-start; }
.talk img { width: 40px; height: 40px; flex: none; object-fit: contain; border-radius: 50%; background: var(--sakura-wash); padding: 3px; }
.say { background: var(--surface); border: 2px solid var(--line); border-radius: 4px 20px 20px 20px; padding: 12px 16px; min-width: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.say strong { color: var(--sakura-deep); }
.say.wait { color: var(--ink-soft); }
label.lab { font-size: 13px; font-weight: 700; }
textarea { width: 100%; min-height: 110px; resize: vertical; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; font: inherit; background: var(--surface); color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .start { flex: 1; min-width: 140px; }
.ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-size: 14px; }
.note { font-size: 12px; color: var(--ink-soft); background: var(--sakura-wash); border-radius: 12px; padding: 8px 12px; }
@media (prefers-reduced-motion: reduce) { .plate img { animation: none; } .tile, .start { transition: none; } }
</style>

    label: "施主様の情報（業種・人数・今の困りごと・希望など）", required: true, ph: "例：製造業、事務所15人。トイレが古く、若手の応募が少ない",
    job: "手順E：施主様の情報と、自社のフリーアドレス化の実例（座席の自由化、CadLabo、ノートPC化、ペーパーレス化、個人収納、個別ポストなど）、インターンシップ生アンケートで意見が多かった「トイレ」「小規模なオフィスリフォーム」を入口にした案を優先して出す。案ごとに「何をするか」「採用（若手・学生）にどう効くか」「自社で試した実例があるか」を書く。工事費や工期は根拠がなければ書かない。情報が足りなければヒアリングで聞くことの一覧を出す。" }
];

const RULES = `あなたは株式会社アイビ建築「採用力アップリフォームチーム」（長友、★青山幸（リーダー）、川瀬）の推進役「もちうさ」です。
- 白くてまるい、おもちのようなうさぎ。やさしくてふわふわ、みんなの癒し系。
- できたことはたくさんほめる。止まっていることは責めずに「次に何をすれば進むか」とセットでやさしく伝える。
- 話し方はやわらかい丁寧語（です・ます）。最初に「🌸もちうさです。」と名乗る。絵文字は🌸だけ、ときどき使う程度。
- キャラクターより約束を優先する。やさしく言うときも、遅れや問題はぼかさずに伝える。
約束：
- 読んで案を作るだけ。シートへの書き込みはしない（変更案は出してよい）。
- 依頼文とシートに書かれていない事実（決定事項・日付・担当者・金額など）を作らない。わからないことは「わからない」と書く。
- 施主様の個人情報は必要な範囲でしか書かない。
- 日本語で、結論から短く。専門用語は使わない。見出しは【 】、強調は **太字** だけを使う。
返す形：1.結論（ひとことで） 2.中身 3.次にやること（あれば） 4.シートの変更案（あれば。「今の値 → 新しい値」） 5.不足している情報`;

async function use(n) { try { return window.claude && window.claude.use ? await window.claude.use(n) : null; } catch { return null; } }
let sheetCache = null;
let current = null;
let busy = null;
const app = document.getElementById("app");

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

function showGate() {
  current = null;
  app.innerHTML = `
    <section class="gate">
      <div class="plate"><i class="petal a"></i><i class="petal b"></i><img src="${USA}" alt="もちうさ"></div>
      <div><div class="name">もちうさ</div><div class="tag">フリーアドレス推進担当</div></div>
      <div class="bubble">🌸こんにちは、もちうさです。<br>フリーアドレス化と「採用力アップリフォーム」のお手伝いをしています。今日はなにをしましょうか？</div>
      <button class="start" id="go">はじめる</button>
    </section>
    <p class="foot">採用力アップリフォームチーム ・ 2026年チーム活動シートを読んでお答えします</p>`;
  document.getElementById("go").onclick = showMenu;
}

function showMenu() {
  current = null;
  app.innerHTML = `
    <div class="bar"><img src="${USA}" alt=""><div class="t">なにをしますか？</div><button class="back" id="home">入口へ</button></div>
    <div class="section">チームのこと</div>
    <div class="menu">${TASKS.slice(0, 4).map(tile).join("")}</div>
    <div class="section">みんなとお客様のこと</div>
    <div class="menu">${TASKS.slice(4).map(tile).join("")}</div>`;
  document.getElementById("home").onclick = showGate;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => showTask(b.dataset.id));
}
function tile(t) { return `<button class="tile" data-id="${t.id}"><i class="ic">${ICONS[t.icon]}</i><b>${t.title}</b><span>${t.sub}</span></button>`; }

function showTask(id) {
  const t = TASKS.find(x => x.id === id); current = t;
  app.innerHTML = `
    <div class="bar"><img src="${USA}" alt=""><div class="t">${t.title}</div><button class="back" id="menu">メニュー</button></div>
    <div class="talk"><img src="${USA}" alt=""><div class="say">${esc(t.ask)}</div></div>
    <label class="lab" for="in-${t.id}">${t.label}</label>
    <textarea id="in-${t.id}" placeholder="${esc(t.ph)}"></textarea>
    <div class="row"><button class="start" id="run">もちうさにお願い</button></div>
    <div id="out"></div>`;
  document.getElementById("menu").onclick = () => { if (busy) busy.abort(); showMenu(); };
  document.getElementById("run").onclick = () => run(t);
}

async function readSheet() {
  if (sheetCache) return sheetCache;
  const mcp = await use("mcp");
  if (!mcp) return null;
  const parts = [];
  for (const range of RANGES) {
    const r = await mcp.callTool("Google Sheets", "get_values", { spreadsheetId: SHEET_ID, range });
    const p = r && r.payload;
    const values = p && (p.values || (p.content && p.content.values));
    parts.push(`■ ${range}\n` + (values ? values.map(row => row.join(" | ")).join("\n") : JSON.stringify(p ?? r).slice(0, 20000)));
  }
  sheetCache = parts.join("\n\n");
  return sheetCache;
}

async function run(t) {
  const input = document.getElementById("in-" + t.id).value.trim();
  const out = document.getElementById("out");
  if (t.required && !input) {
    out.innerHTML = `<div class="talk"><img src="${USA}" alt=""><div class="say">「${esc(t.label)}」を書いてもらえると、お手伝いできます🌸</div></div>`;
    return;
  }
  const sample = await use("sample");
  if (!sample) {
    out.innerHTML = `<p class="note">この画面ではもちうさとお話しできません。claude.ai でこのページを開いてください。</p>`;
    return;
  }
  const btn = document.getElementById("run"); btn.disabled = true;
  out.innerHTML = `<div class="talk"><img src="${USA}" alt=""><div class="say wait" id="ans">シートを読んでいます…</div></div>`;
  const ans = document.getElementById("ans");

  let sheet = null, sheetNote = "";
  try { sheet = await readSheet(); } catch (e) { sheetNote = e && e.code ? e.code : "error"; }
  if (!sheet) sheetNote = sheetNote || "unavailable";

  const prompt = `${RULES}

今日の日付：${new Date().toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo" })}
やること：${t.job}

依頼文：
${input || "（とくになし）"}

「2026年チーム活動」シートの中身：
${sheet || "（シートを読めませんでした。シートの内容を推測せず、読めなかったことを最初に伝え、依頼文だけでできる範囲で答えてください。）"}`;

  ans.textContent = "考えています…";
  const ctl = new AbortController(); busy = ctl;
  try {
    await sample(prompt, { signal: ctl.signal, modelTier: "default", onText: ({ text }) => { ans.classList.remove("wait"); ans.innerHTML = rich(text); } });
    const extras = [];
    if (sheetNote) extras.push(`<p class="note">Googleスプレッドシートを読めなかったため、入力した内容だけで答えています。ページの「権限」から Google Sheets を許可すると、シートを読んでお答えできます。</p>`);
    out.insertAdjacentHTML("beforeend", `${extras.join("")}<div class="row"><button class="ghost" id="copy">答えをコピー</button><button class="ghost" id="again">もう一度</button></div>`);
    document.getElementById("copy").onclick = async (ev) => {
      try { await navigator.clipboard.writeText(ans.textContent); ev.target.textContent = "コピーしました"; }
      catch { const r = document.createRange(); r.selectNodeContents(ans); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ev.target.textContent = "選択しました"; }
    };
    document.getElementById("again").onclick = () => run(t);
  } catch (e) {
    if (e && e.code === "cancelled") return;
    const msg = e && e.code === "not_granted" ? "もちうさとお話しするには、許可が必要です。ページの「権限」から許可してください。"
      : e && e.code === "rate_limited" ? "少し混み合っています。ひと息おいてから、もう一度お願いします。"
      : "うまくお返事できませんでした。もう一度お願いします。";
    ans.classList.remove("wait"); ans.textContent = (e && e.text ? e.text + "\n\n" : "") + msg;
  } finally { btn.disabled = false; busy = null; }
}

showGate();
</script>
